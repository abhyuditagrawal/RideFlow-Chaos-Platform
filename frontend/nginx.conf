# Serves the built dashboard and gives it the same /api/* shape the Vercel
# proxy (api/proxy.js) provides, so one build works in both places.
server {
  listen 80;
  root /usr/share/nginx/html;

  # runs and attacks can take minutes; the dashboard follows them by polling,
  # but a direct caller may wait for the whole run
  proxy_read_timeout 600s;
  proxy_http_version 1.1;

  location = /api/config {
    default_type application/json;
    return 200 '{"mode":"direct"}';
  }

  location /api/chaos/ {
    proxy_pass http://chaos-injector:9000/;
  }

  location /api/security/ {
    proxy_pass http://security-injector:9001/;
  }

  # the ride app's own JWT travels in X-App-Authorization (Authorization is
  # the dashboard password on Vercel); the gateway expects Authorization
  location /api/app/ {
    proxy_set_header Authorization $http_x_app_authorization;
    proxy_pass http://api-gateway:8080/;
  }

  location /assets/ {
    expires 7d;
    add_header Cache-Control "public, immutable";
  }

  location / {
    try_files $uri /index.html;
  }
}
