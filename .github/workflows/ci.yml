name: ci

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  lint-and-test:
    name: lint + test (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - user-service
          - ride-service
          - driver-service
          - pricing-service
    steps:
      - uses: actions/checkout@v4

      - name: Lint and unit test ${{ matrix.service }}
        working-directory: services/${{ matrix.service }}
        run: |
          if [ -f Makefile ]; then
            make test
          else
            echo "No Makefile found for ${{ matrix.service }} yet — skipping (per-service 'make test' target is expected once the service scaffold lands)."
          fi

  frontend:
    name: build (React dashboard)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install and build
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Proxy syntax check
        run: node --check api/proxy.js

  build-images:
    name: build (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - user-service
          - ride-service
          - driver-service
          - pricing-service
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v5
        with:
          context: services/${{ matrix.service }}
          push: false
          tags: rideflow/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: true

      # Trivy CLI from a pinned image rather than aquasecurity/trivy-action@master:
      # a floating branch ref means unreviewed code runs in CI on every push.
      - name: Trivy scan (${{ matrix.service }})
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock             aquasec/trivy:0.58.1 image --scanners vuln             --severity CRITICAL,HIGH --ignore-unfixed --exit-code 1             rideflow/${{ matrix.service }}:${{ github.sha }}

  build-injectors:
    name: build (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - chaos-injector
          - security-injector
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service }}
          push: false
          tags: rideflow/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: true

      # Trivy CLI from a pinned image rather than aquasecurity/trivy-action@master:
      # a floating branch ref means unreviewed code runs in CI on every push.
      - name: Trivy scan (${{ matrix.service }})
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock             aquasec/trivy:0.58.1 image --scanners vuln             --severity CRITICAL,HIGH --ignore-unfixed --exit-code 1             rideflow/${{ matrix.service }}:${{ github.sha }}

  compose-config-check:
    name: validate docker-compose.yml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: docker compose config
        run: docker compose config -q
